olist_ecommerce_dbt:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: 01_ecommerce_dev
      schema: dbt_staging
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth            # browser sign-in, no stored secret
      threads: 4
      connect_timeout: 30
      connect_retries: 3
      retry_all: true
    prod:
      type: databricks
      catalog: 01_ecommerce_prod  # adjust to your real prod catalog name
      schema: dbt_staging
      host: "{{ env_var('DBT_DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      client_id: "{{ env_var('DBT_DATABRICKS_CLIENT_ID') }}"
      client_secret: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_CLIENT_SECRET') }}"
      threads: 8
      connect_timeout: 30
      connect_retries: 3
      retry_all: true