olist_ecommerce_dbt:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: 01_ecommerce_dev
      schema: dbt_dev
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DBT_DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
      connect_timeout: 30
      connect_retries: 3
      retry_all: true
