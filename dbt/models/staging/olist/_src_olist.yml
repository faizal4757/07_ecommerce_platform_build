version: 2

sources:
  - name: olist_bronze
    description: Raw Olist source tables ingested into the development catalog by the existing Databricks Auto Loader jobs.
    database: "{{ var('source_catalog') }}"
    schema: bronze
    # Freshness is intentionally not enabled yet: we have not verified a reliable ingestion timestamp
    # column in the existing Bronze tables. Configure loaded_at_field after confirming that contract.
    tables:
      - name: orders
        description: Bronze orders table from the Olist source dataset.
      - name: customers
        description: Bronze customers table from the Olist source dataset.
      - name: products
        description: Bronze products table from the Olist source dataset.
      - name: sellers
        description: Bronze sellers table from the Olist source dataset.
      - name: order_items
        description: Bronze order items table from the Olist source dataset.
      - name: order_payments
        description: Bronze order payments table from the Olist source dataset.
      - name: order_reviews
        description: Bronze order reviews table from the Olist source dataset.
      - name: geolocation
        description: Bronze geolocation reference table from the Olist source dataset.
      - name: category_translation
        description: Bronze product category translation table from the Olist source dataset.
