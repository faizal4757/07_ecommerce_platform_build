version: 2

models:
  - name: stg_olist__orders
    description: Standardized order header records from Bronze.
    columns:
      - name: order_id
        description: Unique identifier for an order.
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer identifier from the source order.
        tests:
          - not_null
      - name: order_status
        description: Current order lifecycle status reported by the source.
        tests:
          - not_null

  - name: stg_olist__customers
    description: Standardized Olist customer records.
    columns:
      - name: customer_id
        description: Order-level customer identifier.
        tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Identifier used to link multiple customer records to the same person.
        tests:
          - not_null

  - name: stg_olist__order_items
    description: One row per order item as supplied by the source.
    columns:
      - name: order_id
        description: Parent order identifier.
        tests:
          - not_null
      - name: order_item_id
        description: Item sequence within the order.
        tests:
          - not_null
      - name: product_id
        description: Product identifier.
        tests:
          - not_null
      - name: seller_id
        description: Seller identifier.
        tests:
          - not_null

  - name: stg_olist__products
    description: Standardized product records.
    columns:
      - name: product_id
        description: Unique product identifier.
        tests:
          - not_null
          - unique

  - name: stg_olist__sellers
    description: Standardized seller records.
    columns:
      - name: seller_id
        description: Unique seller identifier.
        tests:
          - not_null
          - unique

  - name: stg_olist__order_payments
    description: Payment installment records associated with an order.
    columns:
      - name: order_id
        description: Parent order identifier.
        tests:
          - not_null
      - name: payment_sequential
        description: Sequential payment number within an order.
        tests:
          - not_null

  - name: stg_olist__order_reviews
    description: Customer review records associated with orders.
    columns:
      - name: review_id
        description: Source review identifier. Uniqueness is not asserted until source cardinality is verified.
        tests:
          - not_null
      - name: order_id
        description: Parent order identifier.
        tests:
          - not_null

  - name: stg_olist__category_translation
    description: Product category translations.
    columns:
      - name: product_category_name
        description: Source category name in Portuguese.
        tests:
          - not_null
          - unique

  - name: stg_olist__geolocation
    description: Postal-prefix geolocation observations. Multiple rows per postal prefix are expected.
    columns:
      - name: geolocation_zip_code_prefix
        description: Postal code prefix from the source.
        tests:
          - not_null
